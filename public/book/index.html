<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Online | AutoShine</title>
  <meta name="description" content="Book your mobile vehicle detailing service with AutoShine." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f1115;
      --panel:#121821;
      --panel-2:#161d27;
      --line:rgba(255,255,255,.12);
      --line-strong:rgba(28,117,188,.25);
      --blue:#1c75bc;
      --blue-2:#2d89d9;
      --text:#eef2f7;
      --muted:#9aa5b1;
      --green:#3ddc97;
      --warning:#ffb84d;
      --shadow: rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body{
      margin:0;
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height:1.6;
    }
    a{ color: inherit; text-decoration: none; }
    input, button, select, textarea{
      font: inherit;
    }
    .page-shell{
      min-height:100vh;
      background: #0b0f14;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      background: rgba(13,18,25,.96);
      border-bottom:1px solid var(--line);
      padding: 0 24px;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(8px);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform: uppercase;
      font-size: .8rem;
    }
    .brand-mark{
      width: 22px; height: 22px; border-radius:50%;
      background: linear-gradient(135deg, #ff7d1f, #f14c4c);
      box-shadow: 0 0 0 2px rgba(255,255,255,.08);
    }

    .nav{
      display:flex;
      gap:26px;
      flex-wrap: wrap;
      justify-content:center;
      font-family: 'Oswald', sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: .82rem;
      color: #dfe8f2;
    }
    .nav a{
      opacity: .9;
    }
    .nav a:hover{ opacity:1; }
    .nav .book{
      background: var(--blue);
      padding: 10px 18px;
      border-radius: 4px;
      color:#fff;
      font-weight:600;
      box-shadow: 0 8px 18px rgba(28,117,188,.25);
    }

    .booking-wrap{
      max-width: 760px;
      margin: 40px auto 70px;
      padding: 0 18px;
    }

    .booking-card{
      background: rgba(17,21,28,.92);
      border:1px solid var(--line-strong);
      border-radius: 14px;
      box-shadow: 0 14px 30px var(--shadow);
      overflow: hidden;
    }

    .booking-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding: 18px 28px;
      border-bottom:1px solid var(--line);
      background: rgba(255,255,255,0.01);
    }

    .booking-header h1{
      margin:0;
      font-family:'Oswald',sans-serif;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      font-weight:600;
    }

    .booking-header .badge{
      min-width: 170px;
      text-align:center;
      background: rgba(28,117,188,.12);
      border:1px solid rgba(28,117,188,.32);
      color: #9ed4ff;
      padding: 10px 12px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      font-size: .72rem;
    }

    .booking-body{
      padding: 22px 20px 18px;
    }

    .step{
      display:none;
      animation: fadeIn .2s ease;
    }
    .step.active{
      display:block;
    }

    @keyframes fadeIn{
      from { opacity:0; transform:translateY(3px);}
      to { opacity:1; transform:translateY(0);}
    }

    .section-box{
      margin-bottom: 18px;
      border:1px solid var(--line);
      border-radius: 12px;
      background: rgba(12,16,22,.6);
      padding: 18px 16px;
    }
    .section-title{
      display:flex;
      align-items:center;
      gap:12px;
      font-family:'Oswald',sans-serif;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-size: 1.15rem;
      margin-bottom: 14px;
    }
    .step-num{
      width: 26px; height:26px; border-radius:50%;
      background: var(--blue);
      color:#fff;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size: .85rem;
      font-weight:700;
      box-shadow: 0 8px 20px rgba(28,117,188,.3);
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom: 12px;
    }
    label{
      color: var(--text);
      font-weight: 600;
      font-size: .9rem;
      letter-spacing: .02em;
    }
    input, textarea, select{
      width:100%;
      border:1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      background: rgba(6,10,14,.9);
      color: var(--text);
      padding: 14px 14px;
      outline:none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    input:focus, textarea:focus, select:focus{
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(28,117,188,.12);
    }

    .inline-input{
      display:flex;
      gap:10px;
      align-items:stretch;
      flex-wrap: wrap;
    }
    .inline-input > * { flex: 1 1 240px; }

    .selection-grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap:10px;
    }
    .choice{
      border:1px solid rgba(255,255,255,.15);
      background: rgba(9,13,18,.9);
      color: var(--text);
      padding: 14px 12px;
      border-radius: 10px;
      text-align:center;
      cursor:pointer;
      transition: all .15s ease;
      user-select:none;
    }
    .choice:hover{
      border-color: rgba(28,117,188,.5);
      transform: translateY(-1px);
    }
    .choice.active{
      background: rgba(28,117,188,.18);
      border-color: var(--blue);
      box-shadow: inset 0 0 0 1px rgba(28,117,188,.4);
    }
    .choice small{
      display:block;
      color: var(--muted);
      font-size: .72rem;
      margin-top: 5px;
    }

    .service-list{
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    .service-option{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      width:100%;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(9,13,18,.9);
      color: var(--text);
      border-radius: 10px;
      padding: 14px 16px;
      cursor:pointer;
      text-align:left;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .service-option:hover{
      border-color: rgba(28,117,188,.5);
      transform: translateY(-1px);
    }
    .service-option.active{
      border-color: var(--blue);
      background: rgba(28,117,188,.12);
    }
    .service-option .name{
      font-weight:600;
      font-size: .98rem;
    }
    .service-option .price{
      color:#bfe5ff;
      font-weight:700;
      white-space: nowrap;
    }
    .service-option .meta{
      color: var(--muted);
      font-size: .72rem;
      display:block;
      margin-top:4px;
    }

    .check-row{
      display:flex;
      align-items:center;
      gap:10px;
      color: var(--muted);
      font-size: .82rem;
      margin-top: 10px;
    }
    .check-row input{
      width: 18px; height:18px;
      accent-color: var(--blue);
    }

    .time-grid{
      display:grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap:10px;
    }
    .time-slot{
      background: rgba(9,13,18,.9);
      border:1px solid rgba(255,255,255,.12);
      color: var(--text);
      border-radius: 8px;
      padding: 12px 8px;
      text-align:center;
      cursor:pointer;
      transition: all .12s ease;
    }
    .time-slot:hover{
      border-color: rgba(28,117,188,.45);
    }
    .time-slot.active{
      background: rgba(28,117,188,.18);
      border-color: var(--blue);
      box-shadow: inset 0 0 0 1px rgba(28,117,188,.35);
      color: #dfeeff;
    }
    .time-slot.disabled{
      opacity: .45;
      pointer-events: none;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .cta-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      padding: 12px 6px 0;
      border-top:1px solid var(--line);
    }
    .quote-summary{
      font-size: .9rem;
      color: var(--muted);
    }
    .quote-summary strong{
      color: var(--text);
      font-size: 1.05rem;
    }

    .btn{
      border:none;
      border-radius: 8px;
      padding: 14px 22px;
      font-family:'Oswald',sans-serif;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:700;
      cursor:pointer;
      transition: transform .12s ease, opacity .12s ease;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn.primary{
      background: var(--blue);
      color:#fff;
      box-shadow: 0 12px 22px rgba(28,117,188,.22);
    }
    .btn.secondary{
      background: rgba(255,255,255,.04);
      color: var(--text);
      border:1px solid rgba(255,255,255,.12);
    }
    .btn:disabled{
      opacity: .55;
      cursor: wait;
    }

    .muted{
      color: var(--muted);
    }

    .toast{
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: rgba(17,22,28,.96);
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 8px;
      opacity: 0;
      transform: translateY(10px);
      transition: all .2s ease;
      z-index: 200;
      max-width: 350px;
    }
    .toast.show{
      opacity: 1;
      transform: translateY(0);
    }
    .hidden{ display:none !important; }

    @media (max-width: 768px){
      .selection-grid { grid-template-columns: 1fr; }
      .time-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .nav{ display:none; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>AutoShine</span>
      </div>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/maintenance-detailing">Maintenance Scheme</a>
        <a href="/portfolio">Portfolio</a>
        <a href="/premium-detailing-services">Ceramic Coatings | Polishing</a>
        <a href="/book" class="book">Book Now</a>
      </nav>
    </header>

    <main class="booking-wrap">
      <div class="booking-card">
        <div class="booking-header">
          <h1>Book Your Detail</h1>
          <div class="badge">Manual Approval</div>
        </div>

        <div class="booking-body">
          <div id="step-1" class="step active">
            <div class="section-box">
              <div class="section-title"><span class="step-num">1</span> Where is the car?</div>
              <div class="field">
                <label>Postcode</label>
                <div class="inline-input">
                  <input id="postcode" type="text" value="CV8 1AB" placeholder="e.g. CV8 1AB" />
                  <button class="btn primary" id="check-postcode">Check</button>
                </div>
                <div id="postcode-status" class="muted">Great, we cover your area.</div>
              </div>
            </div>
          </div>

          <div id="step-2" class="step">
            <div class="section-box">
              <div class="section-title"><span class="step-num">2</span> Car size</div>
              <div class="selection-grid">
                <button class="choice active" data-size="S">
                  Small
                  <small>e.g. Polo, Kia, Mini</small>
                </button>
                <button class="choice" data-size="M">
                  Medium
                  <small>e.g. BMW 3 Series, Audi A4</small>
                </button>
                <button class="choice" data-size="L">
                  Large
                  <small>e.g. SUV, 4x4, people carrier</small>
                </button>
              </div>
            </div>
          </div>

          <div id="step-3" class="step">
            <div class="section-box">
              <div class="section-title"><span class="step-num">3</span> What would you like?</div>

              <div class="service-list" id="service-list"></div>

              <div class="check-row">
                <input id="extra-dirt" type="checkbox" />
                <label for="extra-dirt">The car has heavy dirt, mould or lots of pet hair (price may increase)</label>
              </div>

              <div class="check-row">
                <input id="needs-contact" type="checkbox" />
                <label for="needs-contact">I’d prefer to be contacted by phone instead of email</label>
              </div>
            </div>
          </div>

          <div id="step-4" class="step">
            <div class="section-box">
              <div class="section-title"><span class="step-num">4</span> Extras</div>

              <div class="service-list">
                <button class="service-option add-on" data-addon="engine-bay">
                  <div>
                    <div class="name">Engine bay detail</div>
                    <span class="meta">Additional £35</span>
                  </div>
                  <div class="price">+£35</div>
                </button>

                <button class="service-option add-on" data-addon="headlight-restoration">
                  <div>
                    <div class="name">Headlight restoration</div>
                    <span class="meta">From £50, or £40 with another service</span>
                  </div>
                  <div class="price">+£50</div>
                </button>

                <button class="service-option add-on" data-addon="headlight-restoration-uv">
                  <div>
                    <div class="name">Headlight restoration + UV coating</div>
                    <span class="meta">+£80 total when added</span>
                  </div>
                  <div class="price">+£80</div>
                </button>

                <button class="service-option add-on" data-addon="soft-top">
                  <div>
                    <div class="name">Soft top waterproofing</div>
                    <span class="meta">Additional £50</span>
                  </div>
                  <div class="price">+£50</div>
                </button>
              </div>
            </div>
          </div>

          <div id="step-5" class="step">
            <div class="section-box">
              <div class="section-title"><span class="step-num">5</span> Pick a day and time</div>

              <div id="date-picker-wrap">
                <div class="field">
                  <label>Select date</label>
                  <input id="booking-date" type="date" />
                </div>
              </div>

              <div id="time-list" class="time-grid" style="margin-top: 14px;"></div>
            </div>
          </div>

          <div id="step-6" class="step">
            <div class="section-box">
              <div class="section-title"><span class="step-num">6</span> Your details</div>

              <div class="field">
                <label>Name</label>
                <input id="customer-name" type="text" placeholder="Full name" />
              </div>

              <div class="field">
                <label>Mobile number</label>
                <input id="customer-phone" type="tel" placeholder="07700 900000" />
              </div>

              <div class="field">
                <label>Email</label>
                <input id="customer-email" type="email" placeholder="you@example.com" />
              </div>

              <div class="field">
                <label>Car details</label>
                <input id="car-details" type="text" placeholder="Make, model, reg" />
              </div>

              <div class="field">
                <label>Notes</label>
                <textarea id="booking-notes" rows="4" placeholder="Parking, access notes, any extras"></textarea>
              </div>
            </div>
          </div>

          <div class="cta-row">
            <div class="quote-summary">
              Price from: <strong id="quote-preview">£0</strong>
              <div class="muted" id="quote-subtext">Choose a service to begin</div>
            </div>
            <div style="display:flex; gap:10px; flex-wrap: wrap;">
              <button class="btn secondary" id="prev-step">Back</button>
              <button class="btn primary" id="next-step">Continue</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const state = {
      currentStep: 1,
      postcode: '',
      zone: 'Z1',
      size: 'S',
      serviceCode: 'EFD',
      extras: [],
      selectedDate: '',
      selectedTime: '',
      basePrice: 0,
      totalPrice: 0
    };

    const pricing = {
      Z1: {
        EFD: { S: 90, M: 100, L: 110 },
        DCD: { S: 140, M: 150, L: 170 },
        PC1: { S: 250, M: 260, L: 280 },
        PC2: { S: 300, M: 320, L: 350 },
        CC: { S: 550, M: 580, L: 620 }
      },
      Z2: {
        EFD: { S: 100, M: 110, L: 120 },
        DCD: { S: 150, M: 160, L: 180 },
        PC1: { S: 260, M: 270, L: 300 },
        PC2: { S: 320, M: 340, L: 370 },
        CC: { S: 560, M: 590, L: 630 }
      },
      Z3: {
        EFD: { S: 110, M: 120, L: 130 },
        DCD: { S: 160, M: 170, L: 190 },
        PC1: { S: 270, M: 280, L: 310 },
        PC2: { S: 330, M: 350, L: 380 },
        CC: { S: 570, M: 600, L: 640 }
      }
    };

    const services = [
      { code: 'EFD', name: 'Essential Full Detail', duration: 150, summary: '2-3 hours' },
      { code: 'DCD', name: 'Deep Clean Detail', duration: 240, summary: '3-6 hours' },
      { code: 'PC1', name: 'Paint Correction Stage 1', duration: 360, summary: '6 hours' },
      { code: 'PC2', name: 'Paint Correction Stage 2', duration: 480, summary: 'Full day' },
      { code: 'CC', name: 'Ceramic Coating', duration: 480, summary: 'Full day' }
    ];

    const zoneLookup = [
      { regex: /CV8/i, zone: 'Z1' },
      { regex: /CV2|CV3|CV4|CV5|CV6|CV7|CV9|CV10|CV11|CV12|B\d+/i, zone: 'Z2' },
      { regex: /OX|B1|B2|B3|B4|B5|B6|B7|B8|B9|B10|B11|B12|B13|B14|B15|B16|B17|B18|B19|B20/i, zone: 'Z3' }
    ];

    function detectZone(postcode){
      const clean = postcode.trim().toUpperCase();
      for (const item of zoneLookup) {
        if (item.regex.test(clean)) return item.zone;
      }
      return 'Z1';
    }

    function getServiceDuration(serviceCode, size){
      const service = services.find(s => s.code === serviceCode);
      let mins = service ? service.duration : 150;

      if (serviceCode !== 'PC2' && serviceCode !== 'CC') {
        if (size === 'M' || size === 'L') mins += 60;
      }

      if (serviceCode === 'PC2' || serviceCode === 'CC') {
        mins = 480;
      }

      return mins;
    }

    function getBasePrice(serviceCode, size, zone){
      return pricing[zone][serviceCode][size];
    }

    function calcPrice(){
      const zone = state.zone || 'Z1';
      const service = state.serviceCode || 'EFD';
      const size = state.size || 'S';

      let price = getBasePrice(service, size, zone);

      if (state.extras.includes('engine-bay')) price += 35;
      if (state.extras.includes('headlight-restoration')) price += 50;
      if (state.extras.includes('headlight-restoration-uv')) price += 80;
      if (state.extras.includes('soft-top')) price += 50;

      if (document.getElementById('extra-dirt').checked) {
        // user can manually adjust quote after approval; not auto-billing here
      }

      state.totalPrice = price;
      document.getElementById('quote-preview').textContent = `£${price}`;
      document.getElementById('quote-subtext').textContent = `${state.serviceCode} • ${state.size} • ${state.zone}`;
    }

    function renderServices(){
      const list = document.getElementById('service-list');
      list.innerHTML = '';
      services.forEach(service => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'service-option' + (state.serviceCode === service.code ? ' active' : '');
        btn.dataset.code = service.code;
        btn.innerHTML = `
          <div>
            <div class="name">${service.name}</div>
            <span class="meta">${service.summary}</span>
          </div>
          <div class="price">from £${pricing[state.zone][service.code][state.size]}</div>
        `;
        btn.addEventListener('click', () => {
          state.serviceCode = service.code;
          document.querySelectorAll('.service-option').forEach(el => el.classList.remove('active'));
          btn.classList.add('active');
          calcPrice();
        });
        list.appendChild(btn);
      });
    }

    function renderTimeSlots(){
      const container = document.getElementById('time-list');
      container.innerHTML = '';

      if (!state.selectedDate) {
        container.innerHTML = '<div class="muted">Choose a date first</div>';
        return;
      }

      const day = new Date(`${state.selectedDate}T00:00:00`);
      const dayName = day.toLocaleDateString('en-GB', { weekday: 'short' });
      const now = new Date();
      const dateString = state.selectedDate;
      const hours = [];

      for (let h = 8; h <= 18; h += 0.5) {
        const start = new Date(`${dateString}T${String(Math.floor(h)).padStart(2,'0')}:${String((h % 1) * 60).padStart(2,'0')}:00`);
        const end = new Date(start.getTime() + getServiceDuration(state.serviceCode, state.size) * 60 * 1000);

        // avoid slot after 18:00
        if (start.getHours() + (getServiceDuration(state.serviceCode, state.size) / 60) > 18) continue;

        // if date is today, block past times
        if (dateString === now.toISOString().slice(0,10) && start < now) continue;

        const label = start.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        hours.push({ start, end, label });
      }

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'time-slot';
      button.textContent = 'Select time';
      button.disabled = true;
      container.appendChild(button);

      // Render four times initially
      hours.slice(0, 6).forEach(slot => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'time-slot' + (state.selectedTime === slot.label ? ' active' : '');
        btn.textContent = slot.label;
        btn.addEventListener('click', () => {
          state.selectedTime = slot.label;
          renderTimeSlots();
          calcPrice();
        });
        container.appendChild(btn);
      });
    }

    function setCurrentStep(step){
      state.currentStep = step;
      document.querySelectorAll('.step').forEach((el, idx) => {
        el.classList.toggle('active', idx + 1 === step);
      });

      const prevVisible = step > 1;
      document.getElementById('prev-step').style.visibility = prevVisible ? 'visible' : 'hidden';
      const nextButton = document.getElementById('next-step');
      nextButton.textContent = step === 6 ? 'Submit booking request' : 'Continue';
    }

    function validateCurrentStep(){
      if (state.currentStep === 1) {
        const postcode = document.getElementById('postcode').value.trim();
        if (!postcode) {
          showToast('Please enter a postcode.');
          return false;
        }
        state.postcode = postcode;
        state.zone = detectZone(postcode);
        document.getElementById('postcode-status').textContent = `Great, we cover your area. Zone: ${state.zone}`;
        return true;
      }

      if (state.currentStep === 2) {
        return true;
      }

      if (state.currentStep === 3) {
        if (!state.serviceCode) {
          showToast('Please select a service.');
          return false;
        }
        return true;
      }

      if (state.currentStep === 4) {
        return true;
      }

      if (state.currentStep === 5) {
        if (!state.selectedDate || !state.selectedTime) {
          showToast('Please select a date and time.');
          return false;
        }
        return true;
      }

      if (state.currentStep === 6) {
        const required = [
          ['customer-name', 'Please enter your name.'],
          ['customer-phone', 'Please enter your phone number.'],
          ['customer-email', 'Please enter your email.'],
          ['car-details', 'Please add your car details.']
        ];
        for (const [id, msg] of required) {
          const val = document.getElementById(id).value.trim();
          if (!val) {
            showToast(msg);
            return false;
          }
        }
        return true;
      }
      return true;
    }

    function nextStep(){
      if (!validateCurrentStep()) return;

      if (state.currentStep < 6) {
        state.currentStep += 1;
        setCurrentStep(state.currentStep);
        if (state.currentStep === 2) {
          document.querySelectorAll('.choice').forEach(el => {
            el.classList.toggle('active', el.dataset.size === state.size);
          });
        }
        if (state.currentStep === 3) {
          renderServices();
        }
        if (state.currentStep === 5) {
          document.getElementById('booking-date').value = '';
          state.selectedDate = '';
          state.selectedTime = '';
          renderTimeSlots();
        }
        if (state.currentStep === 6) {
          calcPrice();
        }
      } else {
        submitBooking();
      }
    }

    function prevStep(){
      if (state.currentStep > 1) {
        state.currentStep -= 1;
        setCurrentStep(state.currentStep);
      }
    }

    function showToast(message){
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    document.getElementById('check-postcode').addEventListener('click', () => {
      const postcode = document.getElementById('postcode').value.trim();
      if (!postcode) return showToast('Please enter a postcode.');

      state.postcode = postcode;
      state.zone = detectZone(postcode);
      document.getElementById('postcode-status').textContent = `Great, we cover your area. Zone: ${state.zone}`;
      setCurrentStep(2);
    });

    document.querySelectorAll('.choice').forEach(btn => {
      btn.addEventListener('click', () => {
        state.size = btn.dataset.size;
        document.querySelectorAll('.choice').forEach(el => el.classList.toggle('active', el === btn));
        calcPrice();
        renderServices();
      });
    });

    document.querySelectorAll('.add-on').forEach(btn => {
      btn.addEventListener('click', () => {
        const name = btn.dataset.addon;
        if (state.extras.includes(name)) {
          state.extras = state.extras.filter(v => v !== name);
          btn.classList.remove('active');
        } else {
          state.extras.push(name);
          btn.classList.add('active');
        }
        calcPrice();
      });
    });

    document.getElementById('booking-date').addEventListener('change', (e) => {
      state.selectedDate = e.target.value;
      state.selectedTime = '';
      renderTimeSlots();
    });

    document.getElementById('next-step').addEventListener('click', nextStep);
    document.getElementById('prev-step').addEventListener('click', prevStep);

    setCurrentStep(1);
    document.getElementById('postcode').value = 'CV8 1AB';
    state.zone = detectZone('CV8 1AB');
    document.getElementById('postcode-status').textContent = 'Great, we cover your area. Zone: Z1';
    state.serviceCode = 'EFD';
    renderServices();
    calcPrice();

    async function submitBooking(){
      const payload = {
        postcode: document.getElementById('postcode').value.trim(),
        zone: state.zone,
        size: state.size,
        serviceCode: state.serviceCode,
        extraDirt: document.getElementById('extra-dirt').checked,
        prefersPhone: document.getElementById('needs-contact').checked,
        selectedDate: state.selectedDate,
        selectedTime: state.selectedTime,
        extras: state.extras,
        customerName: document.getElementById('customer-name').value.trim(),
        phone: document.getElementById('customer-phone').value.trim(),
        email: document.getElementById('customer-email').value.trim(),
        carDetails: document.getElementById('car-details').value.trim(),
        notes: document.getElementById('booking-notes').value.trim(),
        totalPrice: state.totalPrice
      };

      const submitButton = document.getElementById('next-step');
      submitButton.disabled = true;
      submitButton.textContent = 'Submitting...';

      try {
        const resp = await fetch('/api/book', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await resp.json();

        if (!resp.ok) throw new Error(result.error || 'Booking failed');

        showToast('Booking request sent. We will contact you to confirm your appointment.');
        setTimeout(() => {
          window.location.href = '/book?success=1';
        }, 1500);

      } catch (error) {
        showToast(error.message || 'Something went wrong.');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Submit booking request';
      }
    }
  </script>
</body>
</html>
